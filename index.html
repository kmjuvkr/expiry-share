<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>임박재고 처리 공유 사이트</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1f2937;--muted:#6b7280;--accent:#1b4332;--line:#d1d5db;--err:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--ink:#f3f4f6;--muted:#9ca3af;--line:#374151;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding:16px}
.card{background:var(--card);width:100%;max-width:380px;border-radius:14px;padding:32px 28px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.lock{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
h1{font-size:18px;margin:0 0 6px}
p{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.5}
input[type=password]{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:12px 0 18px;cursor:pointer}
button{width:100%;padding:11px;font-size:15px;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}
</style></head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="lock"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1>임박재고 처리 공유 사이트</h1>

  <input type="password" id="pw" placeholder="비밀번호" autofocus required>
  <label><input type="checkbox" id="rm"> 이 PC에서 기억하기</label>
  <button id="b">열기</button>
  <div class="err" id="e"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openWith(key){
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.i)},key,b64(D.c));
  const html=new TextDecoder().decode(buf);
  // 잠금 화면이 다 읽히기 전에 document.write 하면 덮어쓰지 않고 뒤에 붙어 화면이 섞임 → 로딩 끝난 뒤 교체
  if(document.readyState==="loading") await new Promise(r=>document.addEventListener("DOMContentLoaded",r,{once:true}));
  await new Promise(r=>setTimeout(r,0));
  document.open();document.write(html);document.close();
}
